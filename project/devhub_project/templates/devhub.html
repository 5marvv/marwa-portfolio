<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV.HUB // Workspace</title>
    <!-- Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-icon-180x180.png">
    <link rel="icon" type="image/x-icon" href="/assets/05-moon_98595.ico">

    <style>
        :root { --bg: #fff; --panel: #f4f4f4; --text: #000; --border: #ccc; }
        
        * {
            box-sizing: border-box;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column;
            margin: 0; 
            min-height: 100vh;
        }

        /* Top Horizontal Nav Bar */
        nav { 
            width: 100%; 
            background: var(--panel); 
            border-bottom: 1px solid var(--border); 
            padding: 1rem 2rem; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav h1 { 
            font-size: 1.2rem; 
            margin: 0; 
            letter-spacing: 2px; 
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li { 
            cursor: pointer; 
            color: #555; 
            font-weight: 500;
        }
        
        li:hover { 
            color: #000; 
            font-weight: bold; 
        }

        main { 
            flex: 1; 
            padding: 2rem; 
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card { 
            background: #fff; 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            padding: 2rem; 
            margin-bottom: 2rem; 
        }

        input, textarea { 
            background: #fff; 
            border: 1px solid var(--border); 
            color: #000; 
            padding: 0.8rem; 
            width: 100%; 
            margin-bottom: 1rem; 
            font-family: inherit;
        }

        button { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 0.8rem 1.5rem; 
            cursor: pointer; 
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
                padding: 1rem;
            }

            main {
                padding: 1rem;
            }

            .card {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1>DEV.HUB</h1>
        <ul>
            <li onclick="show('github')">Analysis</li>
            <li onclick="show('snippets')">Snippets</li>
        </ul>
    </nav>
    <main>
        <!-- GitHub Analysis -->
        <section id="github" class="card">
            <h2>GitHub Analyzer</h2>
            <input type="text" id="gh-user" placeholder="Enter GitHub Username">
            <button onclick="analyze()">Fetch Profile</button>
            <div id="gh-data" style="margin-top:2rem;"></div>
        </section>

        <!-- Consolidated Snippet Manager -->
        <section id="snippets" class="card" style="display:none;">
            <h2>Snippet Manager</h2>
            <input type="text" id="search-box" placeholder="Search snippets..." onkeyup="search()">
            <hr>
            <input type="text" id="s-title" placeholder="Snippet Title">
            <input type="text" id="s-tags" placeholder="Tags (comma separated)">
            <textarea id="s-code" rows="5" placeholder="Paste code here..."></textarea>
            <button onclick="saveSnippet()">Save Snippet</button>
            <div id="snippet-list" style="margin-top:2rem;"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script>
        function show(id) {
            document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        async function analyze() {
            const user = document.getElementById('gh-user').value;
            const res = await fetch(`/api/devhub/api/github/${user}`);
            const data = await res.json();
            document.getElementById('gh-data').innerHTML = `<p><strong>User:</strong> ${data.name || user}</p><p><strong>Repos:</strong> ${data.public_repos || 0}</p><p><strong>Languages:</strong> ${data.languages?.join(', ') || 'N/A'}</p>`;
        }

        async function saveSnippet() {
            const payload = {
                title: document.getElementById('s-title').value,
                code: document.getElementById('s-code').value,
                tags: document.getElementById('s-tags').value
            };
            const res = await fetch('/api/devhub/api/snippets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                alert('Snippet Saved!');
                document.getElementById('s-title').value = '';
                document.getElementById('s-code').value = '';
                document.getElementById('s-tags').value = '';
            }
        }

        async function search() {
            const q = document.getElementById('search-box').value;
            if (q.length < 2) return;
            const res = await fetch(`/api/devhub/api/snippets/search/${q}`);
            const data = await res.json();
            const list = document.getElementById('snippet-list');
            list.innerHTML = data.map(s => `<p><strong>${s.title}</strong><br><small>${s.tags}</small></p>`).join('');
        }
    </script>
</body>
</html>
