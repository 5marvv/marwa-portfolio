<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page Title -->
    <title>StockCore // Search & Analyze Any Ticker</title>

    <!-- SEO & Meta Description -->
    <meta name="description" content="Track market trends, monitor volatility, and analyze real-time price and volume data with StockHub's interactive stock dashboard.">

    <!-- Favicon & Touch Icon Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-icon-180x180.png">
    <link rel="icon" type="image/x-icon" href="/assets/05-moon_98595.ico">

    <style>
        :root { --bg: #000; --panel: #111; --text: #fff; --border: #333; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            transition: background 0.5s ease; 
        }

        /* 1. Header / Navbar behavior switch */
        header { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10rem 2rem 2rem; 
            border-bottom: 1px solid transparent; 
            transition: all 0.5s ease; 
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 500px;
            transition: all 0.5s ease;
        }

        /* Navbar Layout State (Triggered after search) */
        body.searched header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.searched .header-content {
            flex-direction: row;
            justify-content: space-between;
            max-width: 100%;
        }

        h2 { font-size: 1.5rem; letter-spacing: 2px; white-space: nowrap; }

        .search-container {
            width: 100%;
            max-width: 400px;
        }

        input#search { 
            background: #111; 
            border: 1px solid var(--border); 
            border-radius: 8px;
            color: white; 
            width: 100%; 
            padding: 0.8rem 1rem; 
            font-size: 1rem; 
            outline: none;
            transition: border-color 0.3s;
        }

        input#search:focus {
            border-color: #666;
        }

        /* 2. Main Dashboard Content */
        main { 
            flex: 1; 
            padding: 2rem 3rem; 
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        body.searched main {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .card { background: var(--panel); padding: 2rem; margin-bottom: 2rem; border: 1px solid var(--border); border-radius: 8px; }
        
        .kpi-bar { display: flex; gap: 2rem; margin: 1.5rem 0 2rem; }
        .kpi { background: var(--panel); border: 1px solid var(--border); padding: 1rem 1.5rem; border-radius: 8px; flex: 1; text-align: center; }
        
        .alert-red { background: #1a0000; }
        .alert-green { background: #001a05; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h2>STOCK.CORE</h2>
            <div class="search-container">
                <input type="text" id="search" placeholder="Enter Ticker (e.g. AAPL)..." onkeypress="if(event.key==='Enter') Dashboard.run()">
            </div>
        </div>
    </header>

    <main>
        <h1 id="c-name">Search a stock</h1>
        <div class="kpi-bar">
            <div class="kpi">Price: <br><strong id="kpi-price" style="font-size:1.4rem;">-</strong></div>
            <div class="kpi">24h Change: <br><strong id="kpi-change" style="font-size:1.4rem;">-</strong>%</div>
            <div class="kpi">Volatility: <br><strong id="kpi-vol" style="font-size:1.4rem;">-</strong>%</div>
        </div>
        <div class="card"><canvas id="chart"></canvas></div>
        <div class="card">
            <h3>Company Profile</h3>
            <p id="c-desc" style="margin-top: 1rem; line-height: 1.6; color: #aaa;"></p>
        </div>
    </main>

    <script>
        const Dashboard = {
            chart: null,
            async run() {
                const sym = document.getElementById('search').value.toUpperCase();
                if (!sym) return;

                // Route through Flask reverse-proxy (Port 5000 -> 5007)
                const res = await fetch(`/api/stocks/api/analyze/${sym}`);
                if (!res.ok) {
                    alert("Stock ticker not found or API error.");
                    return;
                }

                const data = await res.json();
                
                // Transition layout to navbar mode
                document.body.classList.add('searched');

                // Update UI
                document.getElementById('c-name').innerText = data.name;
                document.getElementById('kpi-price').innerText = `$${data.price}`;
                document.getElementById('kpi-change').innerText = data.change;
                document.getElementById('kpi-vol').innerText = data.volatility;
                document.getElementById('c-desc').innerText = data.description;

                // Dynamic background accents
                document.body.className = 'searched ' + (data.change >= 5 ? 'alert-green' : (data.change <= -5 ? 'alert-red' : ''));

                this.updateChart(data);
            },
            updateChart(data) {
                const ctx = document.getElementById('chart').getContext('2d');
                if(this.chart) this.chart.destroy();
                this.chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.dates,
                        datasets: [
                            { type: 'line', label: 'Price', data: data.close, borderColor: '#fff', yAxisID: 'y' },
                            { type: 'bar', label: 'Volume', data: data.volume_data, backgroundColor: '#333', yAxisID: 'y1' }
                        ]
                    },
                    options: { 
                        scales: { 
                            y: { position: 'left', grid: { color: '#222' } }, 
                            y1: { position: 'right', grid: { drawOnChartArea: false } } 
                        } 
                    }
                });
            }
        };
    </script>
</body>
</html>
