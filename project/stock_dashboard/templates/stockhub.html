<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page Title -->
    <title>StockCore // Search & Analyze Any Ticker</title>

    <!-- SEO & Meta Description -->
    <meta name="description" content="Track market trends, monitor volatility, and analyze real-time price and volume data with StockHub's interactive stock dashboard.">

    <!-- Favicon & Touch Icon Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-icon-180x180.png">
    <link rel="icon" type="image/x-icon" href="/assets/05-moon_98595.ico">

    <style>
        :root { --bg: #000; --panel: #111; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; transition: background 0.5s; }
        nav { width: 280px; border-right: 1px solid #333; padding: 2rem; }
        main { flex: 1; padding: 3rem; overflow-y: auto; }
        .card { background: var(--panel); padding: 2rem; margin-bottom: 2rem; border: 1px solid #333; }
        input { background: none; border: none; border-bottom: 1px solid #fff; color: white; width: 100%; padding: 0.5rem; font-size: 1rem; }
        .kpi-bar { display: flex; gap: 2rem; margin-bottom: 2rem; }
        .alert-red { background: #4a0000; }
        .alert-green { background: #004a0e; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <h2>STOCK.CORE</h2>
        <input type="text" id="search" placeholder="Enter Ticker (e.g. AAPL)..." onkeypress="if(event.key==='Enter') Dashboard.run()">
    </nav>
    <main>
        <h1 id="c-name">Search a stock</h1>
        <div class="kpi-bar">
            <div class="kpi">Price: <span id="kpi-price">-</span></div>
            <div class="kpi">24h Change: <span id="kpi-change">-</span>%</div>
            <div class="kpi">Volatility: <span id="kpi-vol">-</span>%</div>
        </div>
        <div class="card"><canvas id="chart"></canvas></div>
        <div class="card">
            <h3>Company Profile</h3>
            <p id="c-desc"></p>
        </div>
    </main>

    <script>
        const Dashboard = {
            chart: null,
            async run() {
                const sym = document.getElementById('search').value.toUpperCase();
                if (!sym) return;

                // Proxy route prefix added here to work through main server (Port 5000 -> 5007)
                const res = await fetch(`/api/stocks/api/analyze/${sym}`);
                if (!res.ok) {
                    alert("Stock ticker not found or API error.");
                    return;
                }

                const data = await res.json();
                
                // Update UI
                document.getElementById('c-name').innerText = data.name;
                document.getElementById('kpi-price').innerText = `$${data.price}`;
                document.getElementById('kpi-change').innerText = data.change;
                document.getElementById('kpi-vol').innerText = data.volatility;
                document.getElementById('c-desc').innerText = data.description;

                // Alerts: Background change
                document.body.className = data.change >= 5 ? 'alert-green' : (data.change <= -5 ? 'alert-red' : '');

                this.updateChart(data);
            },
            updateChart(data) {
                const ctx = document.getElementById('chart').getContext('2d');
                if(this.chart) this.chart.destroy();
                this.chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.dates,
                        datasets: [
                            { type: 'line', label: 'Price', data: data.close, borderColor: '#fff', yAxisID: 'y' },
                            { type: 'bar', label: 'Volume', data: data.volume_data, backgroundColor: '#333', yAxisID: 'y1' }
                        ]
                    },
                    options: { 
                        scales: { 
                            y: { position: 'left', grid: { color: '#222' } }, 
                            y1: { position: 'right', grid: { drawOnChartArea: false } } 
                        } 
                    }
                });
            }
        };
    </script>
</body>
</html>
