<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>AIFA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-icon-180x180.png">
<link rel="icon" type="image/x-icon" href="/assets/05-moon_98595.ico">

<style>
:root{
--bg:#000000;
--text:#d9c8bde6;
--accent:#b89178e6;
}

* {
box-sizing: border-box;
}

body {
background:var(--bg);
font-family:'Playfair Display',serif;
display:flex;
flex-direction:column;
align-items:center;
justify-content: center;
height: 100vh;
height: 100dvh; /* Dynamic viewport height for mobile browsers */
margin:0;
padding: 20px;
overflow: hidden;
}

/* 
  Hero Container: Centered on landing.
  Moves elegantly to the top-left corner on submit.
*/
.hero {
position: absolute;
top: 38%;
left: 50%;
transform: translate(-50%, -50%);
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
z-index: 10;
}

.hero img {
width:160px; 
height:auto;
object-fit: contain;
margin-bottom:15px;
transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

h1 {
color: var(--accent);
font-weight: 400;
letter-spacing: 4px;
margin: 0;
font-size: 38px;
transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 
  Chat Container: Starts centered right below the Hero logo.
  Slides to the bottom when active.
*/
.chat-container {
position: absolute;
top: 55%;
left: 50%;
transform: translate(-50%, -50%);
width: 650px;
max-width: 90%;
display: flex;
flex-direction: column;
align-items: center;
transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
z-index: 5;
}

#chat-box {
display:none;
width: 100%;
max-height: 55vh;
overflow-y: auto;
flex-direction:column;
gap:10px;
margin-bottom: 20px;
padding: 0 10px;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}

#chat-box::-webkit-scrollbar {
display: none;
}

/* Universal message styling */
.message {
margin-bottom:25px;
line-height:1.7;
max-width:85%;
display:flex;
flex-direction:column;
color: var(--text);
}

.user-message {
align-self: flex-end;
text-align: right;
}

.aifa-message {
align-self: flex-start;
text-align: left;
}

em {
display:block;
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
color:var(--accent);
margin-bottom:6px;
}

input {
width:100%;
max-width: 500px;
padding:16px 20px;
font-size:16px;
font-family:'Playfair Display',serif;
background:rgba(20, 20, 20, 0.6);
border:1px solid #333;
border-radius:30px;
text-align:center;
outline:none;
color: var(--text);
backdrop-filter: blur(8px);
transition: all 0.3s ease;
}

input:focus {
border-color: var(--accent);
box-shadow: 0 0 12px rgba(184, 145, 120, 0.2);
}

/* 
  ACTIVE STATE STYLES 
  Triggered when user sends a message
*/
body.chat-active .hero {
top: 25px;
left: 30px;
transform: translate(0, 0);
flex-direction: row; 
gap: 15px;
}

body.chat-active .hero img {
width: 50px; 
margin-bottom: 0;
}

body.chat-active h1 {
font-size: 22px;
letter-spacing: 2px;
}

body.chat-active .chat-container {
top: auto;
bottom: 2rem;
bottom: calc(1.5rem + env(safe-area-inset-bottom)); /* Dynamic spacing for mobile safe areas */
left: 50%;
transform: translate(-50%, 0);
height: calc(100vh - 100px);
height: calc(100dvh - 100px);
justify-content: flex-end;
}

/* Responsive adjustments for mobile screens */
@media (max-width: 600px) {
  body.chat-active .hero {
    top: 15px;
    left: 15px;
  }
  
  body.chat-active .hero img {
    width: 40px;
  }
  
  body.chat-active h1 {
    font-size: 18px;
  }

  .message {
    max-width: 95%;
  }
}

</style>
</head>

<body>

<div class="hero">
  <img src="/assets/logo.jpg" alt="AIFA Logo">
  <h1>AIFA</h1>
</div>

<div class="chat-container">
    <div id="chat-box"></div>
    <input
    id="input"
    placeholder="Type your query..."
    onkeypress="if(event.key==='Enter'){send()}">
</div>

<script>
const API_BASE_URL = window.location.origin.includes("localhost") 
    ? "" 
    : "";

function typeWriter(element, label, text, containerToScroll) {
    element.innerHTML = `<em>${label}</em><span class="text-content"></span>`;
    const textSpan = element.querySelector('.text-content');

    return new Promise((resolve) => {
        let i = 0;
        const interval = setInterval(() => {
            textSpan.textContent = text.substring(0, i);
            i++;

            if (containerToScroll) {
                containerToScroll.scrollTop = containerToScroll.scrollHeight;
            }

            if (i > text.length) {
                clearInterval(interval);
                resolve();
            }
        }, 15);
    });
}

async function send() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat-box");
    const message = input.value.trim();

    if (message === "") return;

    // UI state updates
    document.body.classList.add('chat-active');
    chat.style.display = "flex";

    // Create user message
    const userDiv = document.createElement("div");
    userDiv.className = "message user-message";
    userDiv.innerHTML = `<em>You</em><span class="text-content"></span>`;
    userDiv.querySelector('.text-content').textContent = message;
    chat.appendChild(userDiv);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    // AI response container placeholder
    const aifaDiv = document.createElement("div");
    aifaDiv.className = "message aifa-message";
    chat.appendChild(aifaDiv);

    try {
        const res = await fetch("/api/aifa/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
        });

        const data = await res.json();

        if (res.ok && data.response) {
            await typeWriter(aifaDiv, "AIFA", data.response, chat);
        } else {
            aifaDiv.innerHTML = `<em>Error</em> <span class="text-content"></span>`;
            aifaDiv.querySelector('.text-content').textContent = data.error || "Something went wrong";
        }
    } catch (err) {
        aifaDiv.innerHTML = `<em>Error</em> Could not connect to server.`;
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
